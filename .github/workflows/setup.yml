name: Setup initial kit name

on:
  workflow_dispatch:
    inputs:
      new_kit_name:
        description: 'New Kit Name:'
        default: 'my_awesome_kit'
        required: true
      new_kit_abv:
        description: 'Kit Short Name:'
        default: 'mak'
        required: true

jobs:
  rename:
    runs-on: ubuntu-latest
    # Only run on new repositories, not the template
    if: github.repository != 'Pixel-Fondue/modo-kit-basic'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new branch for changes
        run: |
          git checkout -B rename-kit

      - name: Rename Kit
        run: |
          # Sanitize name
          new_kit_name="${{ github.event.inputs.new_kit_name }}"
          new_kit_name="${new_kit_name// /_}"
          new_kit_name_under="${new_kit_name//-/_}"
          new_kit_short_name="${{ github.event.inputs.new_kit_abv }}"

          # Rename kit name in index.cfg
          sed -i 's/my_modo_kit/'"$new_kit_name_under"'/g' my_modo_kit/index.cfg
          sed -i 's/my_modo_kit/'"$new_kit_name"'/g' my_modo_kit/libs/my_modo_kit/__init__.py
          sed -i 's/my_modo_kit/'"$new_kit_name_under"'/g' my_modo_kit/lxserv/kit_command.py
          sed -i 's/mmk/'"$new_kit_short_name"'/g' my_modo_kit/lxserv/kit_command.py
          sed -i 's/mmk/'"$new_kit_short_name"'/g' my_modo_kit/libs/my_modo_kit/__init__.py
          sed -i 's/mmk/'"$new_kit_short_name"'/g' my_modo_kit/configs/commands.cfg

          # lxserv files must be unique lets prefix them
          mv my_modo_kit/lxserv/kit_command.py "my_modo_kit/lxserv/${new_kit_short_name}_command.py"

          # Rename library folder name (Must be underscores)
          mv my_modo_kit/libs/my_modo_kit "my_modo_kit/libs/$new_kit_name_under"

          # Rename kit folder name
          mv my_modo_kit "$new_kit_name"

      - name: Apply name changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Rename Modo kit" -a
          git push origin rename-kit

      - name: Request Changes
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: 'main'
          source_branch: 'rename-kit'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: 'Rename kit to ${{ github.event.inputs.new_kit_name }}'
          pr_body: 'Automated changes by GitHub Action'
